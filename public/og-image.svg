<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c7ff4a" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#171717" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#252523" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#141413" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.75" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer frame border -->
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#2c2c29" stroke-width="1.5" rx="8" />

  <!-- Accent top bar -->
  <rect x="32" y="32" width="1136" height="4" fill="#c7ff4a" />

  <!-- Status badge -->
  <g transform="translate(80, 88)">
    <rect width="320" height="38" rx="19" fill="#20201d" stroke="#363632" stroke-width="1" />
    <circle cx="22" cy="19" r="5" fill="#c7ff4a" />
    <text x="36" y="24" font-family="monospace" font-size="13" font-weight="600" fill="#a0a09a" letter-spacing="1.5">OPEN FOR PROJECTS · 2026</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#f4f4f0" letter-spacing="-2.5">
    Antony Joaquim<tspan fill="#c7ff4a">.</tspan>
  </text>

  <!-- Role Subtitle -->
  <text x="80" y="310" font-family="monospace" font-size="32" font-weight="700" fill="#c7ff4a" letter-spacing="0.5">
    Web Developer &amp; DevOps
  </text>

  <!-- Value proposition -->
  <text x="80" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#a0a09a">
    Building high-performance websites and resilient infrastructure
  </text>
  <text x="80" y="412" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#757570">
    for ambitious businesses ready to be seen online.
  </text>

  <!-- Tech tags row -->
  <g transform="translate(80, 485)">
    <!-- React -->
    <rect x="0" y="0" width="110" height="42" rx="4" fill="#1e1e1b" stroke="#353531" stroke-width="1" />
    <text x="55" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#f4f4f0" text-anchor="middle">React</text>

    <!-- Three.js -->
    <rect x="122" y="0" width="125" height="42" rx="4" fill="#1e1e1b" stroke="#353531" stroke-width="1" />
    <text x="184" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#f4f4f0" text-anchor="middle">Three.js</text>

    <!-- Python -->
    <rect x="259" y="0" width="115" height="42" rx="4" fill="#1e1e1b" stroke="#353531" stroke-width="1" />
    <text x="316" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#f4f4f0" text-anchor="middle">Python</text>

    <!-- PostgreSQL -->
    <rect x="386" y="0" width="145" height="42" rx="4" fill="#1e1e1b" stroke="#353531" stroke-width="1" />
    <text x="458" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#f4f4f0" text-anchor="middle">PostgreSQL</text>

    <!-- DevOps & CI/CD -->
    <rect x="543" y="0" width="170" height="42" rx="4" fill="#1e1e1b" stroke="#c7ff4a" stroke-width="1" />
    <text x="628" y="26" font-family="monospace" font-size="14" font-weight="600" fill="#c7ff4a" text-anchor="middle">DevOps · CI/CD</text>
  </g>

  <!-- Location & details bottom right -->
  <g transform="translate(860, 502)">
    <text x="240" y="0" font-family="monospace" font-size="14" font-weight="600" fill="#80807b" text-anchor="end">Sergipe, Brasil ↗</text>
    <text x="240" y="22" font-family="monospace" font-size="12" font-weight="500" fill="#585854" text-anchor="end">antonyjoaquim.dev</text>
  </g>
</svg>
